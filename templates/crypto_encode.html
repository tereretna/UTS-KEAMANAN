{% extends "base.html" %}
{% block content %}
<h3 class="fw-bold mb-4">Kriptografi AES-256: Encode</h3>
<div class="row">
    <div class="col-md-6">
        <div class="card-custom">
            <div class="card-header-custom"><i class="bi bi-file-earmark-text me-2"></i> Input Teks Asli</div>
            <div class="p-4">
                <form method="POST" action="/crypto/encode">
                    <div class="mb-4">
                        <label class="form-label">Pesan (Plaintext)</label>
                        <textarea name="message" class="form-control" rows="4" required></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password Enkripsi</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100 py-2">Enkripsi ke Ciphertext</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        {% if result %}
        <div class="card-custom border-primary">
            <div class="card-header-custom"><i class="bi bi-braces-asterisk me-2"></i> Hasil Enkripsi Base64</div>
            <div class="p-4">
                <textarea class="form-control" style="background-color: #eff6ff; border-color: #bfdbfe; color: #1e40af; font-family: monospace;" rows="6" readonly>{{ result }}</textarea>
            </div>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
