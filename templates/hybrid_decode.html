{% extends "base.html" %}
{% block content %}
<h3 class="fw-bold mb-4">Fitur Utama: Hybrid Decode</h3>
<div class="row">
    <div class="col-md-6">
        <div class="card-custom">
            <div class="card-header-custom"><i class="bi bi-box-arrow-in-right me-2"></i> Parameter Ekstraksi</div>
            <div class="p-4">
                <form method="POST" action="/hybrid/decode" enctype="multipart/form-data">
                    <div class="mb-4">
                        <label class="form-label">Upload Gambar Stego (PNG)</label>
                        <input type="file" name="image" class="form-control bg-white" accept=".png" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Kata Kunci (Password AES-256)</label>
                        <input type="password" name="password" class="form-control" placeholder="Masukkan password saat encode" required>
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100 py-2"><i class="bi bi-unlock me-2"></i> Ekstrak & Dekripsi Pesan</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        {% if result %}
        <div class="card-custom" style="border: 1px solid var(--primary-green);">
            <div class="card-header-custom text-success"><i class="bi bi-check-circle me-2"></i> Pesan Ditemukan!</div>
            <div class="p-4">
                <label class="form-label">Hasil Dekripsi (Plaintext):</label>
                <textarea class="form-control" style="background-color: #f0fdf4; border-color: #86efac; color: #166534;" rows="5" readonly>{{ result }}</textarea>
            </div>
        </div>
        {% else %}
        <div class="card-custom text-center p-5">
            <i class="bi bi-search text-muted mb-3" style="font-size: 3rem; opacity: 0.3;"></i>
            <p class="text-muted">Hasil pesan rahasia akan muncul di sini setelah proses berhasil.</p>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
